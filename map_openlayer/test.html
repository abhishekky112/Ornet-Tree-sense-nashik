    html, body, #map {

    }

        --bs-btn-color: #fff;
        --bs-btn-bg: #198754;
        --bs-btn-border-color: #198754;

        --bs-btn-hover-bg: #198754;

    .btn-outline-primary {
      --bs-btn-color: #198754;
      --bs-btn-border-color: #198754;
      --bs-btn-hover-color: #fff;
      --bs-btn-hover-bg: #198754;

  .treeInfo{
    margin-bottom: 5px;
    font-size: 12px;
    font-weight: 500;
  }
    .map-controls button {
      margin: 2px;
      padding: 5px 10px;
      font-size: 12px;
    }
    
    .active-basemap {
      background-color: #198754 !important;
      color: white !important;
    }

    .map-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      background: white;
      padding: 5px;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.2);
    }
    .map-controls button.active-basemap {
      background-color: #007bff;
      color: white;
    }

    .dataTables_wrapper .dataTables_paginate .paginate_button.current, .dataTables_wrapper .dataTables_paginate .paginate_button.current:hover {

    function loadCheckBoxData() {
      const url = "https://www.ornettreecensus.com/treecensusapi/geoserver_dropdown_filters.php";
      const payload = new URLSearchParams({
        appName: "TreeCensus",
        electionName: electionName
      });

      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: payload.toString()
      })
      .then(response => {
        if (!response.ok) throw new Error(`Network error: ${response.status}`);
        return response.json();
      })
      .then(data => {
        filterData = data;

        // After filter data is loaded, apply the filter if filter_type and filter_val are present
        if (filter_type && filter_val) {
          // Find the corresponding checkbox and check it
          const checkbox = document.querySelector(`#container-${filter_type} input[type="checkbox"]`);
          if (checkbox) {
            checkbox.checked = true;
            checkbox.dispatchEvent(new Event('change', { bubbles: true })); // Trigger change event
          }

          // Call onFilterApply to apply the filter based on filter_val
          onFilterApply(filter_val, '', filter_type);
        }
      })
      .catch(error => {
        console.error('Error loading dropdowns:', error);
      });
    }

    if (filter_type) {
      const mainCheckbox = document.querySelector(`#container-${filter_type} input[type="checkbox"]`);
      if (mainCheckbox) {
        mainCheckbox.click(); // ✅ Triggers the nested checkbox generation

        // Delay execution to allow for dynamic content generation (checkboxes) 
        setTimeout(() => {
          const nestedCheckboxes = document.querySelectorAll(`#box-${filter_type} input[type="checkbox"]`);
          
          nestedCheckboxes.forEach(cb => {
            if (cb.value === filter_val) {
              cb.checked = true; // Check the box
              cb.dispatchEvent(new Event("change", { bubbles: true })); // Trigger the change event
              console.log("Selected Filter:", cb.value);

              // Example of map layer handling with OpenLayers
              if (cb.checked) {
                map.getLayers().forEach(layer => {
                  if (layer.get('id') === filter_val) {
                    layer.setVisible(true); // Show the layer based on checkbox
                  }
                });
              } else {
                map.getLayers().forEach(layer => {
                  if (layer.get('id') === filter_val) {
                    layer.setVisible(false); // Hide the layer
                  }
                });
              }
            }
          });
        }, 500); // Delay to ensure nested checkboxes are available
      }
    }

  function populateCheckboxes(items, containerId, valueKey, labelKey) {
      const container = document.getElementById(containerId);
      container.innerHTML = ''; // Clear existing
      const visibleCount = 5;
      const totalCount = items.length;

      const wrapper = document.createElement('div');
      wrapper.classList.add('checkbox-wrapper');

      items.forEach((item, index) => {
        const value = item[valueKey] || '';
        const label = item[labelKey] || '';
        const checkboxId = `${containerId}-checkbox-${index}`;

        const div = document.createElement('div');
        div.className = 'form-check mb-1';

        // Hide those beyond visible count
        if (index >= visibleCount) div.classList.add('extra-checkbox', 'd-none');

        div.innerHTML = `
          <input class="form-check-input" type="checkbox" id="${checkboxId}" value="${value}" onchange="onFilterApply('${checkboxId}', '${value}', '')">
          <label class="form-check-label" for="${checkboxId}">${label}</label>
        `;

        wrapper.appendChild(div);
      });

      container.appendChild(wrapper);

      // Add toggle link if needed
      if (totalCount > visibleCount) {
        const toggleLink = document.createElement('a');
        toggleLink.href = 'javascript:void(0)';
        toggleLink.className = 'toggle-view';
        toggleLink.textContent = '+ View All';

        toggleLink.addEventListener('click', () => {
          const extras = wrapper.querySelectorAll('.extra-checkbox');
          const isHidden = extras[0].classList.contains('d-none');

          extras.forEach(el => el.classList.toggle('d-none'));
          toggleLink.textContent = isHidden ? '- View Less' : '+ View All';
        });

        container.appendChild(toggleLink);
      }
    }

    // Create basemap switcher control
    function createBasemapSwitcher() {
      const container = document.createElement('div');
      container.className = 'map-controls';
      
      // Add fullscreen control
      const fullscreenBtn = document.createElement('button');
      fullscreenBtn.className = 'btn btn-sm btn-outline-secondary';
      fullscreenBtn.title = 'Toggle fullscreen';
      fullscreenBtn.innerHTML = '⛶';
      fullscreenBtn.onclick = function() {
        const mapDiv = document.getElementById('map');
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          mapDiv.requestFullscreen().catch(err => {
            console.error(`Error attempting to enable fullscreen: ${err.message}`);
          });
        }
      };
      container.appendChild(fullscreenBtn);

      // 🟢 Draw Polygon Button
      const drawPolygonBtn = document.createElement('button');
      drawPolygonBtn.className = 'btn btn-sm btn-outline-secondary';
      drawPolygonBtn.title = 'Draw Polygon';
      drawPolygonBtn.textContent = '✒️ Draw Polygon';
      drawPolygonBtn.onclick = function () {
        activatePolygonDraw(); // Make sure this function exists
      };
      container.appendChild(drawPolygonBtn);
      
      // Add basemap buttons
      for (const key in basemaps) {
        const btn = document.createElement('button');
        btn.className = 'btn btn-sm btn-outline-secondary';
        btn.textContent = key;
        btn.onclick = function() {
          for (const layerKey in basemaps) {
            basemaps[layerKey].setVisible(layerKey === key);
          }
          // Update active button styling
          const buttons = container.querySelectorAll('button');
          buttons.forEach(b => {
            if (b.textContent === key) {
              b.classList.add('active-basemap');
            } else {
              b.classList.remove('active-basemap');
            }
          });
        };
        // if (key === 'Satellite') btn.classList.add('active-basemap');
        if (key === 'Hybrid') btn.classList.add('active-basemap');
        container.appendChild(btn);
      }
      return container;
    }

        style: new ol.style.Style({

      function activatePolygonDraw() {
        isRestrictClickPerTreeSelect = true;
        if (drawInteraction) {
          map.removeInteraction(drawInteraction);
        }

        drawInteraction = new ol.interaction.Draw({
          source: drawSource,
          type: 'Polygon'
        });

        map.addInteraction(drawInteraction);

        drawInteraction.on('drawend', function (event) {
        const polygon = event.feature.getGeometry();
        
        // Convert to EPSG:4326 before WKT
        const formatWKT = new ol.format.WKT();
        const transformedPolygon = polygon.clone().transform('EPSG:3857', 'EPSG:4326');
        const wktPolygon = formatWKT.writeGeometry(transformedPolygon);
        // console.log("Drawn WKT Polygon:", wktPolygon);
        // getTreesInsidePolygon(wktPolygon);
        getTreesInsidePolygon(wktPolygon, activeCQLFilter);
        map.removeInteraction(drawInteraction);
      });

      }

      function getTreesInsidePolygon(wktPolygon, cqlFilter = null) {
        let finalFilter = `INTERSECTS(geom,${wktPolygon})`;

        if (cqlFilter) {
          finalFilter += ` AND ${cqlFilter}`;
        }

        const url = `${geoserverUrl}/${workSpaceName}/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=${workSpaceName}:${layerName}&outputFormat=application/json&CQL_FILTER=${encodeURIComponent(finalFilter)}`;

        fetch(url)
          .then((response) => response.json())
          .then((data) => {
            showTreeDataInModal(data);
            isRestrictClickPerTreeSelect = false;
            drawSource.clear();
          })
          .catch((error) => {
            console.error('❌ Error fetching tree data:', error);
          });
      }

      function showTreeDataInModal(data) {
        let html = '';
        const LocalNameCountMap = {};

        if (data.features && data.features.length > 0) {
          let countData = data.features.length;
          document.getElementById("totalTreeFromPolygone").innerText = `(🌳 Trees: ${countData})`;

          // Count each species
          data.features.forEach((feature) => {
            const LocalName = feature.properties.LocalName || 'Unknown';
            LocalNameCountMap[LocalName] = (LocalNameCountMap[LocalName] || 0) + 1;
          });

          // Table header
          html += `
            <h5 class="text-success">🌿 Species Summary</h5>
            <table class="table table-bordered table-striped" id="speciesTable">
              <thead class="table-success">
                <tr>
                  <th>Sr. No.</th>
                  <th>Local Name</th>
                  <th>Count</th>
                </tr>
              </thead>
              <tbody>
          `;


          // Table rows
          let sr = 1;
          for (const [LocalName, count] of Object.entries(LocalNameCountMap)) {
            html += `
              <tr>
                <td>${sr++}</td>
                <td>${LocalName}</td>
                <td>${count}</td>
              </tr>
            `;
          }

          html += `
              </tbody>
            </table>
          `;
        } else {
          html = "<p>No trees found in this area.</p>";
          document.getElementById("totalTreeFromPolygone").innerText = '';
        }

        // Inject into modal and show
        document.getElementById("treeModalBody").innerHTML = html;
        new bootstrap.Modal(document.getElementById("treeModal")).show();
        // Initialize DataTable
        setTimeout(() => {
          $('#speciesTable').DataTable({
            pageLength: 5,
            lengthChange: false,
            searching: true,
            ordering: false
          });
        }, 300);
      }

      function clearDrawings() {
        isRestrictClickPerTreeSelect = false;
        drawSource.clear();

      popupElement.style.position = "absolute";
      popupElement.style.background = "white";
      popupElement.style.padding = "10px";
      popupElement.style.border = "1px solid #ccc";
      popupElement.style.borderRadius = "8px";
      popupElement.style.overflow = "scroll";
      popupElement.style.zIndex = 1000;
      popupElement.style.display = "none";
      popupElement.style.boxShadow = "0 2px 10px rgba(0,0,0,0.3)";
      popupElement.style.width = "631px";

      document.body.appendChild(popupElement);

      // Show popup at screen position
      function showPopup(coordinate, content) {
        const pixel = map.getPixelFromCoordinate(coordinate);
        popupElement.innerHTML = `
          <div style="text-align:right;">
            <button onclick="hidePopup()" style="background:#transparent; color:white; border:none; border-radius:3px; padding:2px 5px; cursor:pointer;">❌</button>
          </div>
          ${content}
        `;
        // popupElement.style.left = `${pixel[0] + 10}px`;
        // popupElement.style.top = `${pixel[1] + 10}px`;
        popupElement.style.left = `32%`;
        popupElement.style.top = `20%`;
        popupElement.style.display = "block";
      }

      function hidePopup() {
        popupElement.style.display = "none";
      }
  
      
      map.on('singleclick', function (evt) {
          if(!isRestrictClickPerTreeSelect){
            const viewResolution = map.getView().getResolution();
            const url = treeLayer.getSource().getFeatureInfoUrl(
              evt.coordinate,
              viewResolution,
              'EPSG:3857',
              {
                'INFO_FORMAT': 'application/json',
                'FEATURE_COUNT': 50
              }
            );
    
            if (url) {
              fetch(url)
                .then(response => response.json())
                .then(data => {
                  if (data.features.length > 0) {
                    let html = `
                      <h3 style="margin-bottom: 10px;">🌲 ${data.features.length} Tree(s):</h3>
                      <ul style="list-style: none; padding: 0; margin: 0;">
                    `;
    
                    data.features.forEach((feature, idx) => {
                      const props = feature.properties;
                      const fixLattitude = parseFloat(props.Lattitude);
                      const fixLongitude = parseFloat(props.Longitude);
                      html += `
                        <li style="margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #ddd;">
                          <div class="row">
                            <div class="col-2">
                                <img src="${props.TreePhoto}" alt="Tree Image" style="width: 108%; height: 113px; border-radius: 4px;">
                            </div>
                            <div class="col-10">
                              <div class="row">
                                <div class="col-4">
                                  <p class="treeInfo"> <span style="color: #198754;">Tree Census Cd:</span> ${props.TreeCensusCd}</p>
                                </div>
                                <div class="col-4">
                                  <p class="treeInfo"> <span style="color: #198754;">Local Name:</span> ${props.LocalName}</p>
                                </div>
                                <div class="col-8">
                                  <p class="treeInfo"> <span style="color: #198754;">Tree UID:</span> ${props.Tree_UID}</p>
                                </div>
                                <div class="col-4">
                                  <p class="treeInfo"> <span style="color: #198754;">Age:</span> ${props.AgeGroup}</p>
                                </div>
                                <div class="col-4">
                                  <p class="treeInfo"> <span style="color: #198754;">Height:</span> ${props.Height}</p>
                                </div>
                                <div class="col-4">
                                  <p class="treeInfo"> <span style="color: #198754;">Girth:</span> ${props.Girth}</p>
                                </div>
                                <div class="col-4">
                                  <p class="treeInfo"> <span style="color: #198754;">Canopy:</span> ${props.Canopy}</p>
                                </div>
                                <div class="col-4">
                                  <p class="treeInfo"> <span style="color: #198754;">Lattitude:</span> ${fixLattitude.toFixed(6)}</p>
                                </div>
                                <div class="col-4">
                                  <p class="treeInfo"> <span style="color: #198754;">Longitude:</span> ${fixLongitude.toFixed(6)}</p>
                                </div>
                                <div class="col-12">
                                  <p class="treeInfo"> <span style="color: #198754;">Survey Date:</span> ${props.AddedDate} - ${props.AddedBy}</p>
                                </div>
                              </div>
                            </div>
                          </div>
                        </li>
                      `;
                    });
    
                    html += "</ul>";
    
    
                    showPopup(evt.coordinate, html);
                  } else {
                    hidePopup(); // 👈 Hide popup if no trees found
                  }
                })
                .catch(err => {
                  console.error("Feature info error:", err);
                  hidePopup(); // 👈 Hide popup on error too
                });
            } else {
              hidePopup();
            }
          }
      });

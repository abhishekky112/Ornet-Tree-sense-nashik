  <style>
    html,
    body,

      margin: 0;

    .nested-checkbox-group .form-check {

    .btn-outline-primary {

      --bs-btn-hover-color: #fff;
      --bs-btn-hover-bg: #198754;

      --bs-btn-active-color: #fff;
      --bs-btn-active-bg: #198754;

    .treeInfo {

    .map-controls button {

    .map-controls {

    .ol-popup {

<body>

  <div class="container-fluid">
    <div class="row">
      <input type="hidden" value="All" id="filter_dateLocation">
      <div class="row mt-3">
      </div>
    </div>

    <div id="map">
      <div class="col-2 filterTypeSet">
        <form autocomplete="off">
          <div class="form-group">
            <label>Filter</label>
            <div id="filter_typeCheckboxes">
              <div id="container-WardWise">

              <div id="container-NonHeritageTrees">

                  Trees</label>
              </div>
              <div id="container-OwnershipStatus">
                <label><input type="checkbox" value="OwnershipStatus" onchange="toggleNestedOptions(this)"> Ownership
                  Status</label>
              </div>
              <div id="container-TreeLocation" style="display: none;">
                <label><input type="checkbox" value="TreeLocation" onchange="toggleNestedOptions(this)"> Tree Location </label>
              </div>
              <div id="container-HealthStatus">
                <label><input type="checkbox" value="HealthStatus" onchange="toggleNestedOptions(this)"> Health
                  Status</label>
              </div>
              <div id="container-EconomicImp">
                <label><input type="checkbox" value="EconomicImp" onchange="toggleNestedOptions(this)"> Economic
                  Imp</label>
              </div>
              <div id="container-AdditionalParameters">
                <label><input type="checkbox" value="AdditionalParameters" onchange="toggleNestedOptions(this)"> Additional Parameters</label>
              </div>
              <!-- <div id="container-TreeAttributes">
                <label><input type="checkbox" value="TreeAttributes" onchange="toggleNestedOptions(this)"> Tree
                  Attributes</label>
              </div> -->
              <div id="container-Environmental">
                <label><input type="checkbox" value="Environmental" onchange="toggleNestedOptions(this)"> Environmental Parameters</label>
              </div>
              <div id="container-Structural">
                <label><input type="checkbox" value="Structural" onchange="toggleNestedOptions(this)"> Structural Parameters</label>
              </div>
              <div id="container-IUCN_Status">
                <label><input type="checkbox" value="IUCN_Status" onchange="toggleNestedOptions(this)"> IUCN
                  Status</label>
              </div>
              <div id="container-Species">
                <label><input type="checkbox" value="Species" onchange="toggleNestedOptions(this)"> Species</label>
              </div>
              <div id="container-Cutted">
                <label><input type="checkbox" value="Cutted" onchange="toggleNestedOptions(this)"> Cutted</label>
              </div>
              <div id="container-Pruned">
                <label><input type="checkbox" value="Pruned" onchange="toggleNestedOptions(this)"> Pruned</label>
              </div>
              <div id="container-AgeGroup">
                <label><input type="checkbox" value="AgeGroup" onchange="toggleNestedOptions(this)"> Age Group</label>
              </div>
              <div id="container-LocalName">
                <label><input type="checkbox" value="LocalName" onchange="toggleNestedOptions(this)"> Tree Name</label>
              </div>
              <div id="container-ButtonWood">
                <label><input type="checkbox" value="ButtonWood" onchange="onFilterApply('box-ButtonWood-checkbox-1', 'ButtonWood', 'ButtonWood')"> Button Wood </label>
              </div>
            </div>
          </div>
        </form>
      </div>

      <div id="popup" class="ol-popup">
        <a href="#" id="popup-closer" class="ol-popup-closer"></a>
        <div id="popup-content"></div>
      </div>


      <!-- ✅ ADD THIS MODAL CODE IN YOUR HTML PAGE -->
      <div class="modal fade" id="treeModal" tabindex="-1" aria-labelledby="treeModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Trees in Locationed Area <span id="totalTreeFromPolygone"></span></h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

    </div>

    <div id="loader" style="
      display: none;
      position: fixed;
      top: 25%;
      left: 50%;
      z-index: 9999;
      transform: translate(-50%, -50%);
    ">
      <div class="spinner"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/Location2@4.1.0-rc.0/dist/js/Location2.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
      let isRestrictClickPerTreeLocation = false;
      let activeCQLFilter = null;
      let filterData = {};
      let drawCircleMode = false;
      let activeFilters = {};
      const urlParam = new URLSearchParams(window.location.search);
      const electionName = urlParam.get('electionName') || 'mbmc';
      const centralLongs = urlParam.get('centralLong');
      const centralLat = urlParam.get('centralLat');
      const ShowExeNameOrCd = urlParam.get('ShowExeNameOrCd') || '';
      let convertLowerElectionName = electionName.toLowerCase();
      const geoserverUrl = 'https://www.ornettreecensus.com/geoserver';
      const workSpaceName = `${convertLowerElectionName}treecensus`;
      const layerName = `${convertLowerElectionName}treecensus`;
      const filter_date = urlParam.get('filter_date');
      const filter_type = urlParam.get('filter_type');
      const filter_val = urlParam.get('filter_val');
      const wardPck = urlParam.get('wardPck');
      const ClearData = urlParam.get('ClearData');
      console.log("ClearData", ClearData);
      // console.log("filter_type", filter_type);
      // console.log("filter_val", filter_val);
      let ULRFilterType = filter_type;

      let typewise = "treeimg";
      if(convertLowerElectionName == "nmmc"){
        typewise = "conditiontrees"
      }else if(convertLowerElectionName == "mbmc"){
        typewise = "typewisetree"
      }else{
        typewise = "treeimg";
      }
      let stylesLayers = typewise;

      var imageproxyurl = "";
      if (electionName == "Amravati" || electionName == "Purna" || electionName == "Wada" || electionName == "Dhule" || electionName == "NANDEDWAGHALA" || electionName == "ULHASNAGAR" || electionName == "SMKC" || electionName == "MBMC" || electionName == "NASHIK" || electionName == "TMC" || electionName == "PANVEL" || convertLowerElectionName === "indore" || convertLowerElectionName == "banglore") {
        imageproxyurl = "https://ornettreecensus.com/treecensusapi/image-proxy.php?url=";
      }

      if(convertLowerElectionName == 'banglore'){
        document.getElementById('container-TreeLocation').style.display = 'block';
      }

  // =================================================================================
  // Google Layer
  // =================================================================================

       // Original Google Street -----------
       const googleStreet = new ol.layer.Tile({
        source: new ol.source.XYZ({
          url: 'http://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',
          tilePixelRatio: 2,
          attributions: '© Google Maps',
        }),
        visible: false,
        title: 'Street'
      });
      // Original Google Street -----------

      const googleSatellite = new ol.layer.Tile({
        source: new ol.source.XYZ({
          url: convertLowerElectionName == "nashik" ? 'https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/Wayback_2024_11_18/MapServer/tile/{z}/{y}/{x}' : 'https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}' ,
          // url: 'https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/Wayback_2024_11_18/MapServer/tile/{z}/{y}/{x}',
          attributions: 'Imagery © Esri, Maxar, Earthstar Geographics',
          maxZoom: 18,
          crossOrigin: 'anonymous',
        }),
        title: 'Esri World Imagery',
        visible: true,
      });

      const googleHybrid = new ol.layer.Group({
        title: 'Esri Hybrid',
        layers: [
          new ol.layer.Tile({
            source: new ol.source.XYZ({
              url: convertLowerElectionName == "mbmb" ? 'https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/Wayback_2024_11_18/MapServer/tile/{z}/{y}/{x}' : 'https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
              attributions: 'Imagery © Esri, Maxar, Earthstar Geographics',
              maxZoom: 18,
              crossOrigin: 'anonymous',
            }),
            title: 'Esri Imagery',
            visible: true,
          }),
          new ol.layer.Tile({
            source: new ol.source.XYZ({
              url: convertLowerElectionName == "mbmb" ? 'https://services.arcgisonline.com/arcgis/rest/services/Reference/World_Boundaries_and_Places/Wayback_2024_11_18/MapServer/tile/{z}/{y}/{x}' : 'https://services.arcgisonline.com/arcgis/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
              attributions: 'Labels © Esri',
              maxZoom: 18,
              crossOrigin: 'anonymous',
            }),
            title: 'Esri Labels',
            visible: true,
          }),
        ]
      });

      // ✅ Tree Layer with filter already applied
      const treeLayer = new ol.layer.Tile({
        source: new ol.source.TileWMS({
          url: `${geoserverUrl}/${workSpaceName}/wms`,
          params: {
            'LAYERS': `${workSpaceName}:${layerName}`,
            'TILED': true,
            'FORMAT': 'image/png',
            'TRANSPARENT': true,
            'VERSION': '1.1.0',
            'CQL_FILTER': activeCQLFilter,
            'STYLES': stylesLayers
          },
          serverType: 'geoserver',
          crossOrigin: 'anonymous',
          transition: 0
        }),
        opacity: 1
      });

      const kmlLayer = new ol.layer.Vector({
        source: new ol.source.Vector({
          url: `kml/${convertLowerElectionName}_kml.kml`,
          format: new ol.format.KML()
        }),
        style: new ol.style.Style({
          stroke: new ol.style.Stroke({
            color: '#ff0000',
            width: 2
          }),
          fill: new ol.style.Fill({
            color: 'rgba(255, 0, 0, 0.1)'
          }),
          image: new ol.style.Circle({
            radius: 5,
            fill: new ol.style.Fill({ color: 'red' }),
            stroke: new ol.style.Stroke({ color: '#fff', width: 1 })
          })
        })
      });

      // ✅ Initialize map after filter is ready
      const map = new ol.Map({
        target: 'map',
        layers: [googleSatellite, googleStreet, googleHybrid, kmlLayer, treeLayer],
        view: new ol.View({
          center: ol.proj.fromLonLat([centralLongs, centralLat]),
          zoom: 12,
          maxZoom: 20,
          // projection: 'EPSG:3857'
        }),
        // controls: ol.control.defaults({
        //   attribution: false
        // })
      });

          // ✅ Focus map when KML is loaded
      kmlLayer.getSource().once('change', function () {
        if (kmlLayer.getSource().getState() === 'ready') {
          const extent = kmlLayer.getSource().getExtent();
          if (extent) {
            map.getView().fit(extent, { size: map.getSize(), padding: [50, 50, 50, 50], duration: 1000 });
          }
        }
      });

    // =================================================================================
    // Page Onload Function 
    // =================================================================================
      if (convertLowerElectionName !== 'mbmc') {
        document.getElementById('container-Cutted').style.display = 'none';
        document.getElementById('container-Pruned').style.display = 'none';
        document.getElementById('container-ButtonWood').style.display = 'none';
      }
      
      if(convertLowerElectionName == 'indore'){
        document.getElementById('container-ButtonWood').style.display = 'block';
      }
      window.onload = function () {
        if (filter_type && filter_val) {
          // console.log("filter_val",filter_type, filter_val);
          switch (filter_type) {
            case 'WardWise':
              activeFilters[filter_type] = filter_val ? `WardNameOrNum='${filter_val}'` : '';
              break;
            case 'HeritageTrees':
              activeFilters[filter_type] = filter_val
                ? `IsHeritageTree='Yes' AND WardNameOrNum='${filter_val}'`
                : `IsHeritageTree='Yes'`;
              break;
            // case 'OwnershipStatus':
            //   activeFilters[filter_type] = filter_val ? `OwnershipOfLand='${filter_val}'` : '';
            //   break;
            case 'OwnershipStatus':
              activeFilters[filter_type] = filter_val  ? `(OwnershipOfLand='${filter_val}')` : '';
            break;
            case 'HealthStatus':
              activeFilters[filter_type] = filter_val ? `HealthCondition='${filter_val}'` : '';
              break;
            case 'EconomicImp':
              activeFilters[filter_type] = filter_val ? `EconomicImp='${filter_val}'` : '';
              break;
            case 'TreeAttributes':
              activeFilters[filterType] = values.map(v => `TreeAttributesJson ILIKE '%${v}%'`).join(' OR ');
              break;
            case 'IUCN_Status':
              activeFilters[filter_type] = filter_val ? `IUCN_Status='${filter_val}'` : '';
              break;
            case 'AdditionalParameters':
              let conditions = [];
              if (values.includes("MedicinalUsage")) {
                conditions.push(`MedicinalUsage = 'Yes'`);
              }
              if (values.includes("PollutionTollerent")) {
                conditions.push(`Pollution_Air_pollution_Carbon_Absorb = 'Pollution Tollerent'`);
              }
              if (values.includes("TemperatureControl")) {
                conditions.push(`TempControl = 'Yes'`);
              }
              if (values.includes("ButterflyAssociatedPlants")) {
                conditions.push(`Butterfly_Associated_Plants = 'Yes'`);
              }
              activeFilters[filterType] = conditions.join(' OR ');
              break;
            case 'Species':
              activeFilters[filter_type] = filter_val ? `Specie='${filter_val}'` : '';
              break;
            case 'Cutted':
              activeFilters[filter_type] = filter_val ? `TreeStatusFlag='Cutted' AND WardNameOrNum='${filter_val}'` : ``;
              break;
            case 'Pruned':
              activeFilters[filter_type] = filter_val ? `TreeStatusFlag='Pruned' AND WardNameOrNum='${filter_val}'` : ``;
              break;
          }
        }
        filters = Object.values(activeFilters).filter(f => f); 
        activeCQLFilter = filters.length ? filters.join(" AND ") : null;
      };

      let urlWard = "";
      let urlOwnership = [];
      let urlHeritage = "";
      let urlNonHeritage = "";
      let urlSpecies = "";
      let urlAgeWard = "";
      let urlAgeGroup = "";
      let urlUsedFilterVal;
      let urlLocalName = null;
      let urlHealth = null;
      let urlTreeWard = null;
      if (filter_type === 'ButtonWood') {
        if (filter_val) {
          const parts = filter_val.split('|'); 

          parts.forEach(part => {
            const [key, value] = part.split(':');
            if (key === 'ward') {
              urlWard = value;
            }
            if (key === 'ownership') {
              urlOwnership = value.split(','); 
            }
          });
        }
      }

      if (filter_type === 'TreeCensusReport') {
        if (filter_val) {
          const parts = filter_val.split('|'); 
          parts.forEach(part => {
            const [key, value] = part.split(':');
            if (key === 'ward') {
              urlWard = value;
            }
            if (key === 'Heritage') {
              urlHeritage = value; 
              urlUsedFilterVal = key;
            }
            if (key === 'NonHeritage') {
              urlNonHeritage = value; 
              urlUsedFilterVal = key;
            }

      function loadCheckBoxData() {
        const url = "https://www.ornettreecensus.com/treecensusapi/geoserver_dropdown_filters.php";
        const payload = new URLSearchParams({
          appName: "TreeCensus",
          electionName: electionName
        });

        fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: payload.toString()
        })
          .then(response => {
            if (!response.ok) throw new Error(`Network error: ${response.status}`);
            return response.json();
          })
          .then(data => {
            filterData = data;
            if (filter_type && filter_val) {
              const checkbox = document.querySelector(`#container-${filter_type} input[type="checkbox"]`);
              if (checkbox) {
                checkbox.checked = true;
                checkbox.dispatchEvent(new Event('change', { bubbles: true })); 
              }
              onFilterApply(filter_val, '', filter_type);
            }
          })
          .catch(error => {
            console.error('Error loading dropdowns:', error);
          });
      }

      function loadTreeLocationFromLayer(filterType, container) {
        const nestedDiv = document.createElement('div');
        nestedDiv.id = `nested-${filterType}`;
        nestedDiv.className = 'nested-checkbox-group mt-0';
        nestedDiv.innerHTML = `<div class="row" id="box-${filterType}"></div>`;
         // ✅ Show loader immediately
        nestedDiv.innerHTML = `
          <div class="nested-loader" id="loader-${filterType}">
            <div class="spinner"></div>
            Loading ${filterType}...
          </div>
          <div class="row d-none" id="box-${filterType}"></div>
        `;
        container.appendChild(nestedDiv);

        const wfsUrl = `${geoserverUrl}/${workSpaceName}/ows?` +
          `service=WFS&version=1.0.0&request=GetFeature` +
          `&typeName=${workSpaceName}:${layerName}` +
          `&maxFeatures=50000` +
          `&outputFormat=application/json`;

          console.log("wfsUrl:",wfsUrl)

        fetch(wfsUrl)
          .then(res => res.json())
          .then(data => {
            const uniqueSet = new Set();

            data.features.forEach(f => {
              let val = "";
              if (filterType === "TreeLocation") {
                val = f.properties?.TreeLocation;
              } else if (filterType === "AgeGroup") {
                val = f.properties?.AgeGroup;
              } else if (filterType === "LocalName") {
                val = f.properties?.LocalName;
              }

              if (val && val.trim() !== "") {
                uniqueSet.add(val.trim());
              }
            });

            const items = Array.from(uniqueSet).map(v => ({
              [filterType]: v   // ✅ FIX
            }));

            // ✅ Hide loader, show checkbox container
            document.getElementById(`loader-${filterType}`).remove();
            const box = document.getElementById(`box-${filterType}`);
            box.classList.remove('d-none');
            if (filterType === "AgeGroup") {
              const sortedValues = Array.from(uniqueSet).sort((a, b) => {
                const aStart = parseInt(a.split('-')[0], 10);
                const bStart = parseInt(b.split('-')[0], 10);
                return aStart - bStart;
              });
              populateCheckboxes( sortedValues.map(v => ({ AgeGroup: v })), `box-${filterType}`, 'AgeGroup', 'AgeGroup');
            } else if (filterType === "TreeLocation") {
              populateCheckboxes( items, `box-${filterType}`, filterType, filterType);
            } else if (filterType === "LocalName") {
              let ColNameVal= "LocalName";
              if(convertLowerElectionName === "indore"){
                ColNameVal = "HindiName";
              }
              const sortedItems = items.sort((a, b) =>
                (a.LocalName || '').localeCompare(b.LocalName || '', undefined, {
                  sensitivity: 'base'
                })
              );
              populateCheckboxes( sortedItems, `box-${filterType}`, 'LocalName', 'LocalName');
            }
            onFilterApply(null, null, filterType);
        })
        .catch(err => {
          console.error("WFS filter error:", err);
        });
      }

      function populateCheckboxes(items, containerId, valueKey, labelKey) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // Clear existing content

        const wrapper = document.createElement('div');
        wrapper.classList.add('checkbox-wrapper');

        items.forEach((item, index) => {
          const value = item[valueKey] || '';
          const label = item[labelKey] || '';
          // ✅ Skip NA and LC values only for IUCN_Status
          if (containerId.includes("IUCN_Status") && (value === "NA" || value === "LC")) {
            return; // Skip this iteration
          }
          const checkboxId = `${containerId}-checkbox-${index}`;

          const div = document.createElement('div');
          div.className = 'form-check mb-1';
          
          div.innerHTML = `
            <input class="form-check-input" type="checkbox" id="${checkboxId}" value="${value}" onchange="onFilterApply('${checkboxId}', '${value}', '')">
            <label class="form-check-label" for="${checkboxId}">${label}</label>
          `;

          wrapper.appendChild(div);
        });

        container.appendChild(wrapper);
      }

      function onFilterApply(checkboxId = null, value = null, filterTypeValue = null) {
        const filterType = filterTypeValue || (checkboxId ? checkboxId.split('-')[1] : null);
        // const allCheckboxes = document.querySelectorAll(`#box-${filterType} input[type="checkbox"]:checked`);
        let values = [];
        if (filterType) {
          const allCheckboxes = document.querySelectorAll(`#box-${filterType} input[type="checkbox"]:checked`);
          values = Array.from(allCheckboxes).map(cb => cb.value);
        }
        document.getElementById('treeSearch').value = '';
        document.getElementById('latInput').value = '';
        document.getElementById('lonInput').value = '';

        const mainCheckbox = document.querySelector(`input[type="checkbox"][value="${filterType}"]`);
        const isMainChecked = mainCheckbox && mainCheckbox.checked;
        // console.log("isMainChecked",isMainChecked);
        if (!isMainChecked) {
          delete activeFilters[filterType];
        }else{
          if (values.length > 0) {
            switch (filterType) {
              case 'WardWise':
                activeFilters[filterType] = values.map(v => `WardNameOrNum='${v}'`).join(' OR ');
                break;
              case 'HeritageTrees':
                activeFilters[filterType] = values.length > 0
                ? `IsHeritageTree='Yes' AND (${values.map(v => `WardNameOrNum='${v}'`).join(' OR ')})`
                : `IsHeritageTree='Yes'`;
                break;
              case 'NonHeritageTrees':
                activeFilters[filterType] = values.length > 0
                  ? `IsHeritageTree <> 'Yes' AND (${values.map(v => `WardNameOrNum='${v}'`).join(' OR ')})`
                  : `IsHeritageTree <> 'Yes'`;
                break;
              // case 'OwnershipStatus':
              //   activeFilters[filterType] = values.map(v => `OwnershipOfLand='${v}'`).join(' OR ');
              //   break;
              case 'OwnershipStatus':
                const orCondition = values.map(v => `OwnershipOfLand='${v}'`).join(' OR ');
                activeFilters[filterType] = `(${orCondition})`;
                break;
              case 'HealthStatus':
                activeFilters[filterType] = values.map(v => `HealthCondition='${v}'`).join(' OR ');
                break;
              case 'EconomicImp':
                activeFilters[filterType] = values.map(v => `EconomicImp='${v}'`).join(' OR ');
                break;
              // case 'TreeAttributes':
              //   activeFilters[filterType] = values.map(v => `TreeAttributesJson ILIKE '%${v}%'`).join(' OR ');
              //   break;
              case 'Environmental':
                activeFilters[filterType] = values.map(v => `TreeAttributesJson ILIKE '%${v}%'`).join(' OR ');
                break;
              case 'Structural':
                activeFilters[filterType] = values.map(v => `TreeAttributesJson ILIKE '%${v}%'`).join(' OR ');
                break;
              case 'IUCN_Status':
                activeFilters[filterType] = values.map(v => `IUCN_Status='${v}'`).join(' OR ');
                break;
              case 'TreeLocation':
                activeFilters[filterType] = `TreeLocation IS NOT NULL AND (${values.map(v => `TreeLocation='${v}'`).join(' OR ')})`;
                break;
              case 'AdditionalParameters':
                if (Array.isArray(values) && values.length > 0) {
                  let conditions = [];
                  values.forEach(val => {
                    switch (val) {
                      case "Medicinal Usage":
                        conditions.push(`MedicinalUsage = 'Yes'`);
                        break;
                        case "Pollution Tollerent":
                        conditions.push(`Pollution_Air_pollution_Carbon_Absorb = 'Pollution Tollerent'`);
                        break;
                        case "Temperature Control":
                        conditions.push(`TempControl = 'Yes'`);
                        break;
                        case "Butterfly Associated Plants":
                        conditions.push(`Butterfly_Associated_Plants = 'Yes'`);
                        break;
                        
                      default:
                        console.warn(`Unknown AdditionalParameter value: ${val}`);
                    }
                  });
                  activeFilters[filterType] = conditions.join(' OR ');
                } else {
                  delete activeFilters[filterType];
                }
                break;

              case 'Species':
                activeFilters[filterType] = values.map(v => `Specie='${v}'`).join(' OR ');
                break;
              case 'Cutted':
                activeFilters[filterType] = `TreeStatusFlag='Cutted' AND (${values.map(v => `WardNameOrNum='${v}'`).join(' OR ')})`;
                break;
              case 'Pruned':
                activeFilters[filterType] = `TreeStatusFlag='Pruned' AND (${values.map(v => `WardNameOrNum='${v}'`).join(' OR ')})`;
                break;
              case 'AgeGroup':
                activeFilters[filterType] = `AgeGroup IS NOT NULL AND (${values.map(v => `AgeGroup='${v}'`).join(' OR ')})`;
                break;
              case 'LocalName':
                let ColName = 'LocalName';
                if(convertLowerElectionName == "indore"){
                  ColName = 'HindiName';
                }
                // else  if(convertLowerElectionName == "banglore"){
                //   ColName = 'KannadName';
                // }
                activeFilters[filterType] = `${ColName} IS NOT NULL AND (${values.map(v => `${ColName}='${v}'`).join(' OR ')})`;
                break;
              }
          }else {
              switch (filterType) {
                case 'HeritageTrees':
                  activeFilters[filterType] = `IsHeritageTree='Yes'`;
                  break;

                case 'Cutted':
                  activeFilters[filterType] = `TreeStatusFlag='Cutted'`;
                  break;

                case 'Pruned':
                  activeFilters[filterType] = `TreeStatusFlag='Pruned'`;
                  break;

                case 'TreeLocation':
                  activeFilters[filterType] = `TreeLocation IS NOT NULL`;
                  break;

                default:
                  delete activeFilters[filterType];
              }
          }
        } 
        const filters = Object.values(activeFilters).filter(f => f); // Remove empty
        activeCQLFilter = filters.length ? filters.join(" AND ") : null;
        let styleType = "treeimg";
        if(convertLowerElectionName == "nmmc"){
          styleType = "conditiontrees";
        }else if(convertLowerElectionName == "mbmc"){
          styleType = "typewisetree";
        }else{
          styleType = "treeimg";
        }
        let stylesLayers = styleType;
        if(filterType === "HeritageTrees"){
          stylesLayers = activeFilters['HeritageTrees'] ? 'haritage_tree' : convertLowerElectionName == "nmmc" ? "conditiontrees" : "treeimg";
        }
        if(filterType === "Cutted"){
          stylesLayers = activeFilters['Cutted'] ? convertLowerElectionName == "mbmc" ? "cuttedTree" : "treeimg" : "treeimg";
        }
        if(filterType === "Pruned"){
          stylesLayers = activeFilters['Pruned'] ? (convertLowerElectionName == "mbmc" ? "prunTree" : "treeimg") : "treeimg";
        }
        console.log("Applied Filter:", activeCQLFilter);

        treeLayer.getSource().updateParams({
          'CQL_FILTER': activeCQLFilter,
          'STYLES': stylesLayers
        });

        if (window.parent) {
          window.parent.postMessage({
              type: 'FILTER_SELECTION',
              filterType,
              ULRFilterType,
              urlUsedFilterVal,
              selectedValues: values,
              applyFilter: activeCQLFilter
          }, "*");
        }
      }

      function activatePolygonDraw() {
        isRestrictClickPerTreeLocation = true;
        if (drawInteraction) map.removeInteraction(drawInteraction);

          source: drawSource,
          type: 'Polygon'

          const polygon = event.feature.getGeometry().clone().transform('EPSG:3857', 'EPSG:4326');
          const wktPolygon = new ol.format.WKT().writeGeometry(polygon);

          getTreesInsidePolygon(wktPolygon, activeCQLFilter);
          map.removeInteraction(drawInteraction);
        });

            drawSource.clear();

          });

      function generateCountTable(features, propertyName, title) {
        const countMap = {};

        features.forEach(({ properties }) => {
          const key = properties[propertyName] || "Unknown";
          countMap[key] = (countMap[key] || 0) + 1;
        });

        const tableId =
          propertyName === "LocalName" ? "speciesTable" :
          propertyName === "OwnershipOfLand" ? "ownershipTable" : "genericTable";

        let tableHTML = `
          <table class="table table-bordered table-striped" id="${tableId}">
            <thead class="table-success">
              <tr>
                <th>Sr. No.</th>
                <th>${title}</th>
                <th>Count</th>
              </tr>
            </thead>
            <tbody>
        `;

        let sr = 1;
        for (const [key, count] of Object.entries(countMap)) {
          tableHTML += `
            <tr>
              <td>${sr++}</td>
              <td>${key}</td>
              <td>${count}</td>
            </tr>
          `;
        }

        tableHTML += `</tbody></table>`;
        return tableHTML;
      }

      const popupContainer = document.getElementById("popup");

      const popup = new ol.Overlay({
        element: container,
        autoPan: true,
        autoPanAnimation: {

      document.getElementById('drawCircleBtn').addEventListener('click', () => {
        drawCircleMode = true;
      });

      map.on('click', function (evt) {
        if (!drawCircleMode) return;
        const radius = 100; // in meters
        const center = evt.coordinate;

        // Create Circle geometry
        const circle = new ol.geom.Circle(center, radius);
        const circleFeature = new ol.Feature({
          geometry: circle
        });

        // Clear and add feature
        drawSource.clear();
        drawSource.addFeature(circleFeature);

        // Convert circle to polygon
        const polygon = ol.geom.Polygon.fromCircle(circle, 16);

        // Transform polygon to EPSG:4326
        const polygon4326 = polygon.clone().transform('EPSG:3857', 'EPSG:4326');

        // Convert polygon to WKT
        const formatWKT = new ol.format.WKT();

      function applyTreeFilter() {
        const searchValue = document.getElementById('treeSearch').value.trim();

        const treeSource = treeLayer.getSource();
        const params = treeSource.getParams();

        let searchFilter = '';
        if (searchValue) {
          const escapedSearch = searchValue.replace(/'/g, "''"); // Escape single quotes
          searchFilter = [
            `LocalName ILIKE '%${escapedSearch}%'`,
            `Specie ILIKE '%${escapedSearch}%'`,
            `WardNameOrNum ILIKE '%${escapedSearch}%'`,
            `Tree_UID ILIKE '%${escapedSearch}%'`,
            `OwnershipOfLand ILIKE '%${escapedSearch}%'`,
            `MedicinalUsage ILIKE '%${escapedSearch}%'`,
            `EconomicImp ILIKE '%${escapedSearch}%'`,
            `AreaName ILIKE '%${escapedSearch}%'`,
            `HealthCondition ILIKE '%${escapedSearch}%'`
          ].join(' OR ');
        }

        const previousFilter = activeCQLFilter || '';
        let finalFilter = '';

        if (previousFilter && searchFilter) {
          finalFilter = `(${previousFilter}) AND (${searchFilter})`;
        } else if (searchFilter) {
          finalFilter = searchFilter;
        } else {
          finalFilter = previousFilter;
        }
        // console.log('Final CQL Filter:', finalFilter);
        // Apply filter
        if (finalFilter) {
          params.CQL_FILTER = finalFilter;
        } else {
          delete params.CQL_FILTER;
        }
        treeSource.updateParams(params);
      }


      document.getElementById('drawCircleByLatLon').addEventListener('click', () => {
        const lat = parseFloat(document.getElementById('latInput').value);
        const lon = parseFloat(document.getElementById('lonInput').value);

        if (isNaN(lat) || isNaN(lon)) {
          alert("Please enter valid latitude and longitude values.");
          return;
        }

        const center = ol.proj.fromLonLat([lon, lat]);
        const radius = 100; // meters

        // Create and show circle on map
        const circle = new ol.geom.Circle(center, radius);
        const circleFeature = new ol.Feature({ geometry: circle });

        drawSource.clear();
        drawSource.addFeature(circleFeature);

        // Convert circle to polygon for filtering
        const polygon = ol.geom.Polygon.fromCircle(circle, 16);
        const polygon4326 = polygon.clone().transform('EPSG:3857', 'EPSG:4326');

        const formatWKT = new ol.format.WKT();
        const wkt = formatWKT.writeGeometry(polygon4326);


        const extent = polygon4326.getExtent();
        const cqlFilter = `BBOX(geom, ${extent.join(',')})`;

        // const cqlFilter = `INTERSECTS(geom, ${wkt})`;
        treeLayer.getSource().updateParams({
          'CQL_FILTER': cqlFilter
        });

        // Optionally remove circle after 1 sec
        setTimeout(() => drawSource.clear(), 2000);
      });

                        <div class="col-10">

                            <div class="col-7"><p class="treeInfo"><span style="color: #198754;">Local Name:</span> ${p.LocalName}</p></div>

                            <div class="col-4"><p class="treeInfo"><span style="color: #198754;">Height:</span> ${p.Height}</p></div>
                            <div class="col-4"><p class="treeInfo"><span style="color: #198754;">Girth:</span> ${p.Girth}</p></div>
                            <div class="col-4"><p class="treeInfo"><span style="color: #198754;">Canopy:</span> ${p.Canopy}</p></div>
                            <div class="col-6"><p class="treeInfo"><span style="color: #198754;">Lattitude:</span> ${fixLat}</p></div>
                            <div class="col-6"><p class="treeInfo"><span style="color: #198754;">Longitude:</span> ${fixLon}</p></div>
                            <div class="col-12"><p class="treeInfo"><span style="color: #198754;">Survey Date:</span> ${p.AddedDate} - ${ShowExeNameOrCd === "ExecutiveCd" ? `User-${p.Executive_Cd}`: p.ExecutiveName}</p></div>
                            ${ManualTreeID}
                          </div>
                        </div>
                      </div>
                    </li>
                  `;
                }).join('');

                content.innerHTML = `
                  <div style="overflow: hidden; padding: 10px;">
                    <h3>🌲 ${data.features.length} Trees:</h3>
                    <ul style="list-style: none; padding: 0;" class="${data.features.length > 0 ? "mapContent" : "mapHandleContent"}">${htmlContent}</ul>
                  </div>
                `;
                popup.setPosition(evt.coordinate);
              } else {
                popup.setPosition(undefined); 
              }
            })
            .catch(err => {
              console.error("Feature info error:", err);
              popup.setPosition(undefined);
            });
        } else {
          popup.setPosition(undefined);
        }
      });
